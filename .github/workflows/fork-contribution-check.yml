name: Fork contribution validation

on:
  push:
    branches: [validation/ivorysql-contributions]

permissions:
  contents: read

concurrency:
  group: fork-contribution-validation
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pr-stack
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libreadline-dev libxml2-dev uuid-dev libssl-dev zlib1g-dev libipc-run-perl
      - name: Configure reduced utility build
        run: |
          mkdir -p validation-logs
          git rev-parse HEAD | tee validation-logs/revision.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/bin/Makefile')
          s = p.read_text()
          marker = '$(recurse)'
          assert marker in s
          p.write_text(s.replace(marker, 'SUBDIRS := $(filter-out pg_rewind,$(SUBDIRS))\n\n' + marker, 1))
          PY
          git diff > validation-logs/ci-only-build-exclusion.patch
          ./configure --prefix="$PWD/inst" --without-icu --with-libxml --with-uuid=e2fs --enable-cassert --enable-debug > validation-logs/configure.log 2>&1
      - name: Build and install
        id: build
        run: |
          make -j2 > validation-logs/build.log 2>&1 || { tail -n 120 validation-logs/build.log; exit 1; }
          make install > validation-logs/install.log 2>&1 || { tail -n 120 validation-logs/install.log; exit 1; }
      - name: Focused PLS_INTEGER regression
        run: |
          make -C src/pl/plisql/src oracle-check REGRESS=plisql_pls_integer > validation-logs/focused.log 2>&1 || { cat validation-logs/focused.log; find src/pl/plisql/src -name regression.diffs -exec cat '{}' \;; exit 1; }
          cat validation-logs/focused.log
      - name: Full PL/iSQL regression
        run: |
          make -C src/pl/plisql/src oracle-check > validation-logs/plisql-full.log 2>&1 || { cat validation-logs/plisql-full.log; find src/pl/plisql/src -name regression.diffs -exec cat '{}' \;; exit 1; }
          cat validation-logs/plisql-full.log
      - name: Oracle core regression
        run: |
          make oracle-check > validation-logs/oracle-core.log 2>&1 || { cat validation-logs/oracle-core.log; find src/oracle_test -name regression.diffs -exec cat '{}' \;; exit 1; }
          tail -n 120 validation-logs/oracle-core.log
      - name: Full ivorysql_ora regression
        run: |
          make -C contrib/ivorysql_ora oracle-check > validation-logs/ivorysql-ora.log 2>&1 || { cat validation-logs/ivorysql-ora.log; find contrib/ivorysql_ora -name regression.diffs -exec cat '{}' \;; exit 1; }
          cat validation-logs/ivorysql-ora.log
      - name: Collect regression evidence
        if: always()
        run: |
          find . -type f \( -name regression.diffs -o -name regression.out -o -name initdb.log -o -name postmaster.log \) -not -path './validation-logs/*' -exec cp --parents '{}' validation-logs/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivorysql-five-pr-integration-audit
          path: validation-logs
          retention-days: 7
